name: Temporary Runtime Final Validation

on:
  push:
    branches:
      - chore/functions-runtime-upgrade-20260906
    paths:
      - '.github/workflows/functions-runtime-prepare.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install workspace from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build Functions
        run: pnpm --filter functions build

      - name: Audit production Functions dependencies (high+)
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high

      - name: Install web dependencies from lockfile
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

      - name: Test web
        working-directory: apps/web
        run: npm run test

      - name: Build web
        working-directory: apps/web
        run: npx vite build
