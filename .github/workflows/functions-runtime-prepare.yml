name: Temporary Functions Runtime Prepare

on:
  push:
    branches:
      - chore/functions-runtime-upgrade-20260906
    paths:
      - '.github/workflows/functions-runtime-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Upgrade Firebase SDK and CLI
        run: |
          pnpm --filter functions add firebase-functions@latest firebase-admin@latest
          pnpm add -Dw firebase-tools@latest
          cd functions
          npm install --package-lock-only --ignore-scripts

      - name: Build Functions
        run: pnpm --filter functions build

      - name: Commit dependency updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/package.json functions/package-lock.json package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(functions): upgrade Firebase SDK and CLI'
          git push
