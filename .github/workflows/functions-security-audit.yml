name: Temporary Functions Security Audit

on:
  push:
    branches:
      - chore/functions-runtime-upgrade-20260906
    paths:
      - '.github/workflows/functions-security-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit production Functions dependencies
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high
