name: Temporary Functions Security Remediation

on:
  push:
    branches:
      - chore/functions-runtime-upgrade-20260906
    paths:
      - '.github/workflows/functions-security-audit.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Upgrade compatible Firebase Admin and pin safe patch transitive versions
        run: |
          pnpm --filter functions add firebase-admin@13
          node <<'NODE'
          const fs = require('fs');
          const rootPath = 'package.json';
          const fnPath = 'functions/package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          const fn = JSON.parse(fs.readFileSync(fnPath, 'utf8'));
          const safe = {
            'form-data@<2.5.6': '2.5.6',
            'websocket-driver@<0.7.5': '0.7.5',
            'protobufjs@<=7.6.4': '7.6.5'
          };
          root.pnpm = root.pnpm || {};
          root.pnpm.overrides = { ...(root.pnpm.overrides || {}), ...safe };
          fn.overrides = { ...(fn.overrides || {}), ...safe };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');
          fs.writeFileSync(fnPath, JSON.stringify(fn, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
          cd functions
          npm install --package-lock-only --ignore-scripts

      - name: Build Functions
        run: pnpm --filter functions build

      - name: Audit npm production dependencies (high+)
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high

      - name: Commit compatible security upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/package.json functions/package-lock.json package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(functions): apply targeted production dependency security fixes'
          git push
