name: Temporary Functions Runtime Deploy

on:
  push:
    branches:
      - chore/functions-runtime-upgrade-20260906
    paths:
      - '.github/workflows/functions-runtime-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Functions
        run: pnpm --filter functions build

      - name: Audit production Functions dependencies (high+)
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ github.workspace }}/firebase-sa.json"

      - name: Deploy all current Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          pnpm exec firebase deploy \
            --only functions \
            --project planner-web-quick \
            --non-interactive

      - name: List deployed Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: pnpm exec firebase functions:list --project planner-web-quick
