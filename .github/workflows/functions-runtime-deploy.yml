name: Temporary Functions Runtime Cleanup and Deploy

on:
  push:
    branches:
      - chore/functions-runtime-upgrade-20260906
    paths:
      - '.github/workflows/functions-runtime-deploy.yml'

jobs:
  cleanup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Functions
        run: pnpm --filter functions build

      - name: Prepare Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ github.workspace }}/firebase-sa.json"

      - name: Delete intentionally retired Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          pnpm exec firebase functions:delete applicationCompleteAward --region asia-northeast3 --project planner-web-quick --force
          pnpm exec firebase functions:delete awardEngine --region asia-northeast3 --project planner-web-quick --force
          pnpm exec firebase functions:delete reflectionAward --region asia-northeast3 --project planner-web-quick --force
          pnpm exec firebase functions:delete runGardenSettlementNow --region asia-northeast3 --project planner-web-quick --force
          pnpm exec firebase functions:delete todoAward --region asia-northeast3 --project planner-web-quick --force

      - name: Deploy all current Functions on Node.js 22
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          pnpm exec firebase deploy \
            --only functions \
            --project planner-web-quick \
            --non-interactive

      - name: List deployed Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: pnpm exec firebase functions:list --project planner-web-quick
