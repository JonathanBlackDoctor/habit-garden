name: Firebase Deploy

# Firebase 백엔드(functions / firestore rules / storage rules) 배포 전용 워크플로.
# 프론트엔드는 GitHub Pages (pages.yml) 가 담당하므로 여기서는 hosting 을 배포하지 않습니다.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Node.js 22 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm-lock.yaml 을 기준으로 의존성을 재현 가능하게 설치한다.
          # cache: pnpm

      - name: 의존성 설치 (workspace 전체)
        run: pnpm install --frozen-lockfile

      - name: Cloud Functions 빌드
        run: pnpm --filter functions build

      - name: Functions 프로덕션 의존성 보안 점검
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high

      - name: Firebase 서비스 계정 자격증명 준비
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ github.workspace }}/firebase-sa.json"

      - name: Firebase 배포
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          pnpm exec firebase deploy \
            --only functions,firestore,storage \
            --project planner-web-quick \
            --non-interactive
