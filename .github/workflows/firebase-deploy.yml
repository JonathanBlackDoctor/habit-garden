name: Firebase Deploy

# 수동 실행은 백엔드 전체 배포를 유지한다.
# 자동 배포는 변경된 핵심 함수만 대상으로 한다.
# 기존 기도제목 복구는 배포된 repairPrayerBodies 함수를 로그인한 클라이언트가 호출한다.
# 프론트엔드는 pages.yml에서 별도 배포한다.
on:
  push:
    branches: [main]
    paths:
      - 'functions/src/dailyReset.ts'
      - 'shared/todoCarryover.ts'
      - 'functions/src/parsePrayer.ts'
      - 'functions/src/index.ts'
      - '.github/workflows/firebase-deploy.yml'
      - 'pnpm-workspace.yaml'
      - 'functions/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Node.js 22 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 의존성 설치
        run: pnpm install --no-frozen-lockfile

      - name: 플래너 회귀 테스트
        run: pnpm --filter web test

      - name: Cloud Functions 빌드
        run: pnpm --filter functions build

      - name: Functions 프로덕션 의존성 보안 점검
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high

      - name: Firebase 서비스 계정 자격증명 준비
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo 'FIREBASE_SERVICE_ACCOUNT secret is not configured.' >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${{ runner.temp }}/firebase-sa.json"

      - name: Firebase 배포
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = 'push' ]; then
            CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            TARGETS=()
            if echo "$CHANGED" | grep -Eq '^(functions/src/dailyReset[.]ts|shared/todoCarryover[.]ts)$'; then
              TARGETS+=('functions:dailyReset')
            fi
            if echo "$CHANGED" | grep -Eq '^(functions/src/(parsePrayer|index)[.]ts|[.]github/workflows/firebase-deploy[.]yml|pnpm-workspace[.]yaml|functions/package[.]json)
              TARGETS+=('functions:parsePrayerBulk' 'functions:repairPrayerBodies')
            fi
            TARGET="$(IFS=,; echo "${TARGETS[*]}")"
            if [ -z "$TARGET" ]; then
              echo 'No matching Firebase functions changed.'
              exit 0
            fi
          else
            TARGET='functions,firestore,storage'
          fi
          pnpm exec firebase deploy \
            --only "$TARGET" \
            --project planner-web-quick \
            --non-interactive

      - name: 임시 자격증명 정리
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-sa.json"
; then
              TARGETS+=('functions:parsePrayerBulk' 'functions:repairPrayerBodies')
            fi
            TARGET="$(IFS=,; echo "${TARGETS[*]}")"
            if [ -z "$TARGET" ]; then
              echo 'No matching Firebase functions changed.'
              exit 0
            fi
          else
            TARGET='functions,firestore,storage'
          fi
          pnpm exec firebase deploy \
            --only "$TARGET" \
            --project planner-web-quick \
            --non-interactive

      - name: 임시 자격증명 정리
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-sa.json"
