packages:
  - 'apps/*'
  - 'functions'
  - 'shared'

# pnpm 11부터 빌드 허용 목록은 package.json의 `pnpm` 필드가 아니라
# workspace 설정에서 읽는다. 새 클론에서도 install/test/build가 멈추지 않게 한다.
allowBuilds:
  esbuild: true
  protobufjs: true
  re2: true

# Workspace-wide patched transitive dependencies (used by pnpm 10/11).
overrides:
  'form-data@<2.5.6': 2.5.6
  'websocket-driver@<0.7.5': 0.7.5
  'protobufjs@<=7.6.4': 7.6.5
  '@fastify/busboy': ^3.2.2
  '@grpc/grpc-js': ^1.14.5
  'proxy-addr': ^2.0.8
